name: SCiFi Foods
description: SCiFi Foods was a San Francisco Bay Area food-technology startup, founded in 2019 by Joshua
  March (CEO) and Kasia Gora (CTO), that developed cultivated (cell-cultured) beef blended with plant-based
  ingredients to make burgers close to the taste of conventional meat. The company used a proprietary
  platform built on gene-editing tools such as CRISPR to create and screen hundreds of animal cell lines
  each month. Backed by a16z among others, SCiFi Foods raised roughly $40M before ceasing operations in
  June 2024; its cell lines were later released to academia via the Good Food Institute. The company is
  defunct and exposes no public API, developer portal, or technical surface.
